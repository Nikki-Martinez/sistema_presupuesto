<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Cuotas</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="contenedor">

        <header class="encabezado">
            <h1><i class="fa-solid fa-credit-card"></i> Panel de Cuotas</h1>
            <div class="acciones-respaldo">
                <button type="button" class="btn btn-gris" id="btnExportar"><i class="fa-solid fa-download"></i> Exportar</button>
                <button type="button" class="btn btn-gris" id="btnImportar"><i class="fa-solid fa-upload"></i> Importar</button>
                <input type="file" id="archivoImportar" accept="application/json,.json" hidden>
            </div>
        </header>

        <!-- Resumen -->
        <section class="resumen" id="resumen">
            <div class="resumen-item">
                <span class="resumen-etiqueta">Deuda total restante</span>
                <strong class="resumen-valor" id="resDeuda">Q 0.00</strong>
            </div>
            <div class="resumen-item">
                <span class="resumen-etiqueta">Total pagado</span>
                <strong class="resumen-valor" id="resPagado">Q 0.00</strong>
            </div>
            <div class="resumen-item">
                <span class="resumen-etiqueta">Cuotas del mes</span>
                <strong class="resumen-valor" id="resMes">Q 0.00</strong>
            </div>
            <div class="resumen-item">
                <span class="resumen-etiqueta">Próximo vencimiento</span>
                <strong class="resumen-valor resumen-texto" id="resProximo">—</strong>
            </div>
        </section>

        <!-- Formulario -->
        <section class="tarjeta-form">
            <div class="form-titulo">
                <i class="fa-solid fa-calendar-plus"></i>
                <h2 id="tituloForm">Nuevo Plan de Cuotas</h2>
            </div>

            <form id="formPlan" novalidate>
                <div class="form-grid">
                    <label class="campo">
                        <i class="fa-solid fa-file-lines"></i>
                        <input type="text" id="descripcion" placeholder="Descripción del pago" maxlength="60" required>
                    </label>

                    <label class="campo">
                        <i class="fa-solid fa-building-columns"></i>
                        <select id="bancoSelect">
                            <option value="">Seleccionar banco...</option>
                        </select>
                    </label>

                    <label class="campo">
                        <i class="fa-solid fa-circle-plus"></i>
                        <input type="text" id="bancoNuevo" placeholder="O nuevo banco" maxlength="40">
                    </label>

                    <label class="campo">
                        <span class="simbolo">Q</span>
                        <input type="number" id="total" placeholder="Saldo total" min="0.01" step="0.01" inputmode="decimal" required>
                    </label>

                    <label class="campo">
                        <i class="fa-solid fa-hashtag"></i>
                        <input type="number" id="cuotas" placeholder="N° de cuotas" min="1" step="1" inputmode="numeric" required>
                    </label>

                    <label class="campo">
                        <i class="fa-solid fa-circle-check"></i>
                        <input type="number" id="pagadas" placeholder="Cuotas ya pagadas" min="0" step="1" inputmode="numeric">
                    </label>

                    <label class="campo campo-ancho">
                        <i class="fa-solid fa-calendar-day"></i>
                        <input type="number" id="dia" placeholder="Día de pago (1-31)" min="1" max="31" step="1" inputmode="numeric" required>
                    </label>
                </div>

                <div class="form-botones">
                    <button type="submit" class="btn btn-azul btn-grande" id="btnGuardar">
                        <i class="fa-solid fa-calculator"></i> <span id="textoGuardar">Generar Plan de Cuotas</span>
                    </button>
                    <button type="button" class="btn btn-gris btn-grande" id="btnCancelar" hidden>
                        <i class="fa-solid fa-xmark"></i> Cancelar
                    </button>
                </div>
            </form>
        </section>

        <!-- Filtros -->
        <section class="filtros">
            <label class="filtro">
                <span>Banco</span>
                <select id="filtroBanco"><option value="">Todos</option></select>
            </label>
            <label class="filtro">
                <span>Estado</span>
                <select id="filtroEstado">
                    <option value="">Todos</option>
                    <option value="aldia">Al día</option>
                    <option value="porvencer">Por vencer</option>
                    <option value="liquidado">Liquidados</option>
                </select>
            </label>
            <label class="filtro">
                <span>Ordenar por</span>
                <select id="orden">
                    <option value="vencimiento">Próximo vencimiento</option>
                    <option value="banco">Banco</option>
                    <option value="restante">Mayor saldo restante</option>
                    <option value="nombre">Descripción</option>
                </select>
            </label>
        </section>

        <!-- Planes -->
        <section class="grid-planes" id="listaPlanes"></section>
        <p class="vacio" id="vacio" hidden>
            <i class="fa-solid fa-inbox"></i><br>
            No hay planes para mostrar. Crea el primero con el formulario de arriba.
        </p>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="js/app.js"></script>
</body>
</html>
